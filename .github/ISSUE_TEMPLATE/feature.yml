name: Feature
description: A new user-facing capability (usually one user story)
labels: ["feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <user>, I want <goal> so that <reason>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Designs, links to docs (e.g. requirements.md US-01), open questions.
